<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>煙の地図 ADMIN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans JP", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 24px 20px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 3px;
    }

    .sub {
      margin-top: 6px;
      font-size: 12px;
      color: #aaa;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border: 1px solid #111;
      padding: 24px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      margin-bottom: 12px;
      padding: 0 12px;
      border: 1px solid #111;
      background: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      height: 50px;
      border: 0;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <header>
    <h1>煙の地図 ADMIN</h1>
    <div class="sub">SMOKING PLACE MAP / MANAGEMENT</div>
  </header>

  <main>
    <div class="card" id="login-card">
  <h2>管理者ログイン</h2>

  <input
    type="email"
    id="login-email"
    placeholder="メールアドレス"
  >

  <input
    type="password"
    id="login-password"
    placeholder="パスワード"
  >

  <button onclick="adminLogin()">ログイン</button>
</div>
<div class="card" id="shop-form" style="display: none;">
<button onclick="adminLogout()" style="margin-bottom: 20px;">
  ログアウト
</button>
  <h2>店舗を登録</h2>

      <input type="text" id="shop-name" placeholder="店名">

      <input type="text" id="shop-address" placeholder="住所">

      <select id="shop-category">
       <option>居酒屋</option>
       <option>喫茶店</option>
       <option>カフェ</option>
</select>

      <select id="shop-cigarette">
       <option value="true">紙たばこOK</option>
       <option value="false">紙たばこNG</option>
</select>

      <select id="shop-heated">
       <option value="true">加熱式OK</option>
       <option value="false">加熱式NG</option>
</select>
     <select id="shop-smoking">
  <option value="全席喫煙可">全席喫煙可</option>
  <option value="喫煙室あり">喫煙室あり</option>
  <option value="加熱式のみ">加熱式のみ</option>
  <option value="店外喫煙所">店外喫煙所</option>
  <option value="分煙">分煙</option>
  <option value="禁煙">禁煙</option>
</select>
  <label>営業時間</label>

<div style="display: flex; gap: 8px;">
  <input type="time" id="shop-opening-time">
  <span style="line-height: 48px;">〜</span>
  <input type="time" id="shop-closing-time">
</div>

      <button id="save-shop-button" onclick="addShop()">店舗を登録する</button>

      <button
  id="cancel-edit-button"
  onclick="cancelEdit()"
  style="display: none; margin-top: 8px;"
>
  編集をキャンセル
</button>
    </div>
    <div class="card" id="shop-list-card" style="display: none; margin-top: 20px;">
  <h2>登録済み店舗</h2>

  <div id="shop-list">
    <!-- ここに店舗一覧が表示される -->
  </div>
</div>
  </main>
<script>
  const SUPABASE_URL = "https://oztvvxsmsnwwussuryfd.supabase.co";

  const SUPABASE_KEY = "sb_publishable_9b2QtGHwNb_x1HK9SxGCtQ_1hh1NEbe";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  let editingShopId = null;

  function normalizeText(text) {
  return text
    .normalize("NFKC")
    .replace(/\s+/g, "")
    .toLowerCase();
}

  async function adminLogin() {
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("ログインできませんでした！");
    console.error(error);
    return;
  }

document.getElementById("login-card").style.display = "none";
document.getElementById("shop-form").style.display = "block";
document.getElementById("shop-list-card").style.display = "block";

await loadShopList();

alert("ログイン成功！");
}
async function adminLogout() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    console.error("ログアウトエラー:", error);
    alert("ログアウトできませんでした！");
    return;
  }

  editingShopId = null;

  document.getElementById("login-card").style.display = "block";
  document.getElementById("shop-form").style.display = "none";
  document.getElementById("shop-list-card").style.display = "none";

  document.getElementById("login-email").value = "";
  document.getElementById("login-password").value = "";

  alert("ログアウトしました！🔐");
}
async function loadShopList() {
  const { data, error } = await supabaseClient
    .from("shops")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    console.error("店舗一覧の取得エラー:", error);
    return;
  }

 const shopList = document.getElementById("shop-list");

shopList.innerHTML = "";

data.forEach(shop => {
  shopList.innerHTML += `
    <div style="padding: 15px 0; border-bottom: 1px solid #ddd;">
      <strong>${shop.name}</strong>
      <p style="margin: 6px 0;">${shop.address}</p>
      <small>${shop.category} / ${shop.smoking}</small>

<button onclick="editShop(${shop.id})" style="margin-top: 12px;">
  ✏️ この店舗を編集
</button>

<button onclick="deleteShop(${shop.id})" style="margin-top: 8px;">
  🗑️ この店舗を削除
</button>

</div>
  `;
});
}
async function editShop(id) {
    editingShopId = id;
    document.getElementById("save-shop-button").textContent = "変更を保存する";
    document.getElementById("cancel-edit-button").style.display = "block";
  const { data, error } = await supabaseClient
    .from("shops")
    .select("*")
    .eq("id", id)
    .single();

  if (error) {
    console.error("店舗情報の取得エラー:", error);
    alert("店舗情報を取得できませんでした！");
    return;
  }

  document.getElementById("shop-name").value = data.name;
  document.getElementById("shop-address").value = data.address;
  document.getElementById("shop-category").value = data.category;
  document.getElementById("shop-cigarette").value = String(data.cigarette);
  document.getElementById("shop-heated").value = String(data.heated);
  document.getElementById("shop-smoking").value = data.smoking || "";
  document.getElementById("shop-opening-time").value = data.opening_time || "";
  document.getElementById("shop-closing-time").value = data.closing_time || "";
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
function cancelEdit() {
  editingShopId = null;

document.getElementById("save-shop-button").textContent = "店舗を登録する";
document.getElementById("cancel-edit-button").style.display = "none";
  document.getElementById("shop-name").value = "";
  document.getElementById("shop-address").value = "";
  document.getElementById("shop-category").selectedIndex = 0;
  document.getElementById("shop-cigarette").selectedIndex = 0;
  document.getElementById("shop-heated").selectedIndex = 0;
  document.getElementById("shop-smoking").value = "";
  document.getElementById("shop-opening-time").value = "";
  document.getElementById("shop-closing-time").value = "";
}
async function updateShop() {
  const name = document.getElementById("shop-name").value;
  const address = document.getElementById("shop-address").value;
  const category = document.getElementById("shop-category").value;
  const cigarette = document.getElementById("shop-cigarette").value === "true";
  const heated = document.getElementById("shop-heated").value === "true";
  const smoking = document.getElementById("shop-smoking").value;
  const openingTime = document.getElementById("shop-opening-time").value;
  const closingTime = document.getElementById("shop-closing-time").value;

  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q=${encodeURIComponent(address)}`
  );

  const data = await response.json();

  if (data.length === 0) {
    alert("住所が見つかりませんでした！");
    return;
  }

  const lat = Number(data[0].lat);
  const lng = Number(data[0].lon);

  const today = new Date().toLocaleDateString("sv-SE", {
    timeZone: "Asia/Tokyo"
  });

  const { error } = await supabaseClient
    .from("shops")
    .update({
      name: name,
      address: address,
      lat: lat,
      lng: lng,
      category: category,
      cigarette: cigarette,
      heated: heated,
      smoking: smoking,
      opening_time: openingTime,
      closing_time: closingTime,
      confirmed: today
    })
    .eq("id", editingShopId);

  if (error) {
    console.error("店舗更新エラー:", error);
    alert("変更を保存できませんでした！");
    return;
  }

  alert("店舗情報を更新しました！✏️");

  editingShopId = null;
document.getElementById("save-shop-button").textContent = "店舗を登録する";
document.getElementById("cancel-edit-button").style.display = "none";
document.getElementById("shop-name").value = "";
document.getElementById("shop-address").value = "";
document.getElementById("shop-category").selectedIndex = 0;
document.getElementById("shop-cigarette").selectedIndex = 0;
document.getElementById("shop-heated").selectedIndex = 0;
document.getElementById("shop-smoking").value = "";
document.getElementById("shop-opening-time").value = "";
document.getElementById("shop-closing-time").value = "";
  await loadShopList();
}
async function deleteShop(id) {
  const ok = confirm("この店舗を本当に削除しますか？");

  if (!ok) {
    return;
  }

  const { error } = await supabaseClient
    .from("shops")
    .delete()
    .eq("id", id);

  if (error) {
    console.error("店舗削除エラー:", error);
    alert("削除できませんでした！");
    return;
  }

  alert("店舗を削除しました！🗑️");

  await loadShopList();
}
// ↓↓↓ この下に追加！
async function addShop() {
  const name = document.getElementById("shop-name").value;
  const address = document.getElementById("shop-address").value;
  const category = document.getElementById("shop-category").value;
  const cigarette = document.getElementById("shop-cigarette").value === "true";
  const heated = document.getElementById("shop-heated").value === "true";
  const smoking = document.getElementById("shop-smoking").value;
  const openingTime = document.getElementById("shop-opening-time").value;
  const closingTime = document.getElementById("shop-closing-time").value;
  if (name.trim() === "") {
  alert("店名を入力してください！");
  return;
}

if (address.trim() === "") {
  alert("住所を入力してください！");
  return;
}
  if (editingShopId !== null) {
  await updateShop();
  return;
}
const { data: existingShops, error: duplicateError } = await supabaseClient
  .from("shops")
  .select("id, name, address");

if (duplicateError) {
  console.error("重複チェックエラー:", duplicateError);
  alert("店舗の確認中にエラーが発生しました！");
  return;
}

const duplicateShop = existingShops.find(shop =>
  normalizeText(shop.name) === normalizeText(name) &&
  normalizeText(shop.address) === normalizeText(address)
);

if (duplicateShop) {
  alert("この店舗はすでに登録されています！");
  return;
}
const response = await fetch(
  `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q=${encodeURIComponent(address)}`
);

const data = await response.json();

if (data.length === 0) {
  alert("住所が見つかりませんでした！");
  return;
}

const lat = Number(data[0].lat);
const lng = Number(data[0].lon);

console.log("緯度:", lat);
console.log("経度:", lng);
const today = new Date().toLocaleDateString("sv-SE", {
  timeZone: "Asia/Tokyo"
});

const { error } = await supabaseClient
  .from("shops")
  .insert({
    name: name,
    address: address,
    lat: lat,
    lng: lng,
    category: category,
    cigarette: cigarette,
    heated: heated,
    smoking: smoking,
    opening_time: openingTime,
    closing_time: closingTime,
    confirmed: today
  });

if (error) {
  console.error("店舗登録エラー:", error);
  alert("店舗を登録できませんでした！");
  return;
}

alert("店舗を登録しました！🚬");

document.getElementById("shop-name").value = "";
document.getElementById("shop-address").value = "";
document.getElementById("shop-category").selectedIndex = 0;
document.getElementById("shop-cigarette").selectedIndex = 0;
document.getElementById("shop-heated").selectedIndex = 0;
document.getElementById("shop-smoking").value = "";

await loadShopList();
}
async function checkLoginSession() {
  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    document.getElementById("login-card").style.display = "none";
    document.getElementById("shop-form").style.display = "block";
    document.getElementById("shop-list-card").style.display = "block";

    await loadShopList();
  }
}

checkLoginSession();
</script>
</body>
</html>
